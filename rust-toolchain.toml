# Nuva OS Rust Toolchain Configuration
# For cross-compilation to ARM64 and x86_64

[toolchain]
channel = "nightly"
components = ["rust-src", "rustfmt", "clippy"]
targets = ["aarch64-unknown-none", "x86_64-unknown-none", "riscv64-unknown-none"]

[env]
# Target specification
RUST_TARGET = "aarch64-nuva-none"

# Compilation flags
RUSTFLAGS = "-C target-cpu=cortex-a76 -C target-feature=+neon -C link-arg=-Tkernel/arch/arm64/linker.ld"
