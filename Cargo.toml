[package]
name = "nuva"
version = "1.0.0"
edition = "2021"
authors = ["Nuva OS Team <kellen9903@gmail.com>"]
license = "Apache-2.0"
description = "Nuva OS - A modern, quantum-safe, AI-native operating system"
repository = "https://github.com/nuva-os/nuva"
keywords = ["os", "kernel", "quantum", "ai", "embedded"]
categories = ["embedded", "hardware-support", "os"]

[lib]
name = "nuva"
path = "lib.rs"

[[bin]]
name = "nuva_kernel"
path = "main.rs"

[features]
default = ["nuva_native"]
nuva_native = []
posix = []
bsd_compat = ["posix"]
arm64 = []
x64 = []
loongarch64 = []
riscv64 = []
qemu_virt = ["riscv64"]
kirin = ["arm64"]
kirin9000 = ["arm64"]
kirin9010 = ["arm64"]
kirin9020 = ["arm64", "kirin"]
snapdragon8gen4 = ["arm64"]
loongson3a6000 = ["loongarch64"]
loongson3c6000 = ["loongarch64"]
intel_core = ["x64"]
amd_ryzen = ["x64"]
debug = []
smp = []
skip_dep_check = []

[dependencies]
# Core dependencies
spin = "0.9"
log = { version = "0.4", default-features = false }
bitflags = "2.3"

# Allocator
linked_list_allocator = "0.10"

# Async runtime (optional)
embassy-sync = { version = "0.2", optional = true }

[dev-dependencies]
# Testing
proptest = "1.2"
criterion = "0.5"

[build-dependencies]
# Build tools
cc = "1.0"

[profile.dev]
panic = "abort"
opt-level = 0

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
panic = "abort"

[workspace]
members = [
    "tools/dep_analyzer",
]

[[bench]]
name = "performance_bench"
harness = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-none", "aarch64-unknown-none", "riscv64-unknown-none"]
